[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bitnbulid"
version = "0.1.0"
description = "Autonomous orbital traffic management system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sgp4>=2.23",
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
